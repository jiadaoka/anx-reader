name: anx_reader
description: "An e-book reader."
publish_to: 'none'

version: 0.2.0+1

environment:
  sdk: '>=3.5.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6
  # 鸿蒙（ohos）没有上游实现，下面四个换成了带 ohos 平台的 fork。
  # 上游版与 fork 版的 Dart API 一致，差异只在各平台子包。
  file_picker:
    path: third_party/file_picker
  path_provider:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages
      path: packages/path_provider/path_provider
      ref: br_path_provider-v2.1.5_ohos
  image: ^4.3.0
  sqflite:
    git:
      url: https://gitcode.com/Anxcye/flutter_sqflite
      ref: br_v2.4.1_ohos
      path: sqflite
  path: ^1.9.0
  shared_preferences:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages
      path: packages/shared_preferences/shared_preferences
      ref: br_shared_preferences-v2.5.4_ohos
  provider: ^6.1.2
  flutter_gen_runner: ^5.4.0
  # 两套 SDK 的 flutter_localizations 分别 pin 0.20.2（鸿蒙 3.41）/ 0.20.3（日常 3.47），
  # 用区间约束让两边都能解析。
  intl: '>=0.20.2 <0.20.4'
  flutter_colorpicker: ^1.0.3
  html: ^0.15.4
  flutter_html: ^3.0.0-beta.2
  archive: ^3.6.1
  flutter_inappwebview:
    git:
      url: https://gitcode.com/Anxcye/flutter_inappwebview
      ref: br_v6.1.5_ohos
      path: flutter_inappwebview
  shelf: ^1.4.1
  fl_chart: ^0.70.2
  graphview: ^1.3.2
  flutter_rating_bar: ^4.0.1
  permission_handler:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_permission_handler
      ref: br_permission_handler_v11.3.1_ohos
      path: permission_handler
  webdav_client:
    path: third_party/webdav_client
    # Vendored from Anxcye/webdav_client@3c6d0eb + 301/307/308 redirect follow (#345).
    # Switch back to git ref once the fork commit can be pushed.
  fluttertoast:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_fluttertoast
      ref: br_8.2.8_ohos
  dio: ^5.4.3+1
  pubspec_parse: ^1.2.3
  logging: ^1.2.0
  # Anxcye 的 fork 才带 ohos 实现（上游 3.0.2 没有），体积小，直接 vendor。
  flutter_file_dialog:
    path: third_party/flutter_file_dialog
  contentsize_tabbarview:
    git:
      url: https://github.com/Anxcye/contentsize_tabbarview.git
      ref: feat/animation
  wakelock_plus:
    git:
      url: https://gitcode.com/openharmony-sig/fluttertpc_wakelock_plus
      ref: br_v1.3.2_ohos
      path: wakelock_plus
  iconsx_plus: ^1.0.1
  url_launcher:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages
      path: packages/url_launcher/url_launcher
      ref: br_url_launcher-v6.3.2_ohos
  sqflite_common_ffi: ^2.3.3
  battery_plus:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_plus_plugins
      ref: br_battery_plus-v6.1.0_ohos
      path: packages/battery_plus/battery_plus
  # 平台实现包：应用不直接 import，但必须进依赖图，否则 flutter 工具不会
  # 把它们写进 GeneratedPluginRegistrant.ets，运行时通道没人应答。
  shared_preferences_ohos:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      path: packages/shared_preferences/shared_preferences_ohos
      ref: br_shared_preferences-v2.5.4_ohos
  sqflite_ohos:
    git:
      url: https://gitcode.com/Anxcye/flutter_sqflite
      ref: br_v2.4.1_ohos
      path: sqflite_ohos
  flutter_tts:
    git:
      url: https://github.com/Anxcye/flutter_tts.git
      ref: 88d20d282354d6d211f15f721b9c43796edd1b68
  sticky_headers: ^0.3.0+2
  photo_view: ^0.15.0
  flutter_smart_dialog: ^4.9.8+1
  saver_gallery: ^4.0.1
  share_plus:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_plus_plugins
      ref: br_share_plus-v12.0.1_ohos
      path: packages/share_plus/share_plus
  device_info_plus:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_plus_plugins
      ref: br_device_info_plus_v11.4.0_ohos
      path: packages/device_info_plus/device_info_plus
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  chinese_font_library: ^1.2.0
  flex_color_scheme: ^8.3.0
  sqlite3_flutter_libs: ^0.5.26
  flutter_reorderable_grid_view: ^5.4.0
  uuid: ^4.5.1
  desktop_drop: ^0.5.0
  audio_service:
    git:
      url: https://gitcode.com/openharmony-sig/fluttertpc_audio_service
      ref: br_v0.18.18_ohos
      path: audio_service
  audio_session:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_audio_session.git
      ref: br_v0.2.2_ohos
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  flutter_heatmap_calendar:
    git:
      url: https://github.com/Anxcye/flutter_heatmap_calendar
  csv: ^6.0.0
  fast_gbk: ^1.0.0
  window_manager: ^0.4.3
  screen_retriever: ^0.2.0
  pretty_dio_logger: ^1.4.0
  dio_intercept_to_curl: ^0.2.0
  flutter_gemini: ^3.0.0
  gpt_markdown: ^1.1.4
  pointer_interceptor: ^0.10.1+2
  connectivity_plus:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_plus_plugins
      ref: br_connectivity_plus-v6.1.0_ohos
      path: packages/connectivity_plus/connectivity_plus
  http: ^1.3.0
  web_socket_channel: ^3.0.2
  crypto: ^3.0.6
  audioplayers: ^6.4.0
  in_app_purchase: ^3.2.1
  asn1lib: ^1.6.2
  in_app_purchase_storekit: ^0.3.21
  charset: ^2.0.1
  flutter_slidable: ^4.0.0
  cached_network_image: ^3.4.1
  lpinyin: ^2.0.3
  mongol: ^9.3.0
  introduction_screen: ^3.1.17
  flutter_floating_bottom_bar: ^1.3.0
  langchain: ^0.8.1
  langchain_anthropic: ^0.3.1
  langchain_google: ^0.7.1+2
  langchain_openai: 0.8.1+1
    # git:
    #   url: https://github.com/Anxcye/langchain_dart.git
    #   ref: bb06c17ca667a906e3e37154b0bda95023d0c9bd
    #   path: packages/langchain_openai
  langchain_core: ^0.4.1
  skeletonizer: ^2.1.0+1
  scrollable_positioned_list: ^0.3.8
  math_expressions: ^2.5.0
  # share_handler: ^0.0.25
  share_handler:
    git:
      url: https://github.com/Anxcye/share_handler.git
      path: share_handler
      ref: eeaa04d22e7e70babb55b6825b9ca7016e89c89a
  heroine: ^0.5.0+2
  vibration: ^3.1.4
  staggered_reorderable:
    git:
      url: https://github.com/Anxcye/staggered_reorderable.git
      ref: 2ac799a6eeb5da74bf5080a2ba2057272fa52b78
  haptic_feedback: ^0.6.4+2
  # 鸿蒙 SDK 是 Dart 3.11.5，而 0.5.x 要求 3.12；本分支只用于鸿蒙构建，
  # 先把 Android 侧钉回 0.4.x。Android / Play 的构建走 develop。
  in_app_purchase_android: ^0.4.0
  webview_cef: ^0.5.1

dependency_overrides:
  # 下面四个换了来源（git / 本地 shim），而其它包仍按 hosted 约束要求它们，
  # 所以这里必须再声明一次，pub 才会采用非 hosted 的来源。
  file_picker:
    path: third_party/file_picker
  path_provider:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages
      path: packages/path_provider/path_provider
      ref: br_path_provider-v2.1.5_ohos
  shared_preferences:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages
      path: packages/shared_preferences/shared_preferences
      ref: br_shared_preferences-v2.5.4_ohos
  sqflite:
    git:
      url: https://gitcode.com/Anxcye/flutter_sqflite
      ref: br_v2.4.1_ohos
      path: sqflite
  # Play Billing Library 8 (required by Google Play). in_app_purchase 3.2.x
  # still pins ^0.4.0, and 3.3+ would pull storekit 0.4 (StoreKit 2 default).
  # 鸿蒙 SDK 的 Dart 是 3.11.5，0.5.x 需要 3.12，本分支钉回 0.4.x。
  in_app_purchase_android: ^0.4.0
  # P1 的四个插件同样换了来源，原因同上面四个。
  permission_handler:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_permission_handler
      ref: br_permission_handler_v11.3.1_ohos
      path: permission_handler
  url_launcher:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages
      path: packages/url_launcher/url_launcher
      ref: br_url_launcher-v6.3.2_ohos
  fluttertoast:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_fluttertoast
      ref: br_8.2.8_ohos
  flutter_file_dialog:
    path: third_party/flutter_file_dialog
  # P2：TTS 链与设备/网络相关插件，同样换来源。
  audio_service:
    git:
      url: https://gitcode.com/openharmony-sig/fluttertpc_audio_service
      ref: br_v0.18.18_ohos
      path: audio_service
  audio_session:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_audio_session.git
      ref: br_v0.2.2_ohos
  device_info_plus:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_plus_plugins
      ref: br_device_info_plus_v11.4.0_ohos
      path: packages/device_info_plus/device_info_plus
  connectivity_plus:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_plus_plugins
      ref: br_connectivity_plus-v6.1.0_ohos
      path: packages/connectivity_plus/connectivity_plus
  wakelock_plus:
    git:
      url: https://gitcode.com/openharmony-sig/fluttertpc_wakelock_plus
      ref: br_v1.3.2_ohos
      path: wakelock_plus
  battery_plus:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_plus_plugins
      ref: br_battery_plus-v6.1.0_ohos
      path: packages/battery_plus/battery_plus
  share_plus:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_plus_plugins
      ref: br_share_plus-v12.0.1_ohos
      path: packages/share_plus/share_plus
  # flutter_inappwebview 的 ohos 实现要求三个子包同源，版本由 fork 决定。
  flutter_inappwebview_platform_interface:
    git:
      url: https://gitcode.com/Anxcye/flutter_inappwebview
      ref: br_v6.1.5_ohos
      path: flutter_inappwebview_platform_interface
  flutter_inappwebview_web:
    git:
      url: https://gitcode.com/Anxcye/flutter_inappwebview
      ref: br_v6.1.5_ohos
      path: flutter_inappwebview_web
  flutter_inappwebview_ohos:
    git:
      url: https://gitcode.com/Anxcye/flutter_inappwebview
      ref: br_v6.1.5_ohos
      path: flutter_inappwebview_ohos
  flutter_inappwebview_windows:
    git:
      url: https://gitcode.com/Anxcye/flutter_inappwebview
      ref: br_v6.1.5_ohos
      path: flutter_inappwebview_windows
  # sqflite 的 ohos 平台声明了 default_package: sqflite_ohos，但 fork 主包没有依赖它，
  # 需要在这里补上来源。
  sqflite_ohos:
    git:
      url: https://gitcode.com/Anxcye/flutter_sqflite
      ref: br_v2.4.1_ohos
      path: sqflite_ohos
  # sqflite_ohos 用 path 依赖这两个包，而 sqflite 主包按 hosted 约束要它们，
  # 两边的来源必须统一到 fork 上。
  sqflite_platform_interface:
    git:
      url: https://gitcode.com/Anxcye/flutter_sqflite
      ref: br_v2.4.1_ohos
      path: sqflite_platform_interface
  sqflite_common:
    git:
      url: https://gitcode.com/Anxcye/flutter_sqflite
      ref: br_v2.4.1_ohos
      path: sqflite_common
  webview_cef:
    path: third_party/webview_cef
  googleai_dart:
    path: third_party/googleai_dart
  langchain_google:
    path: third_party/langchain_google
  langchain:
    git:
      url: https://github.com/Anxcye/langchain_dart.git
      ref: 310fb6b3
      path: packages/langchain
  langchain_core:
    git:
      url: https://github.com/Anxcye/langchain_dart.git
      ref: 310fb6b3
      path: packages/langchain_core
  langchain_openai:
    git:
      url: https://github.com/Anxcye/langchain_dart.git
      ref: 310fb6b3
      path: packages/langchain_openai
  langchain_anthropic:
    git:
      url: https://github.com/Anxcye/langchain_dart.git
      ref: 310fb6b3
      path: packages/langchain_anthropic
#  analyzer: ^8.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  custom_lint: ^0.7.5
  riverpod_generator: ^2.4.3
  riverpod_lint: ^2.3.13
  freezed: ^3.0.2
  json_serializable: ^6.9.0
#  flutter_launcher_icons: ^0.11.0


flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/SourceHanSerifSC-Regular.otf
    - pubspec.yaml
    - assets/foliate-js/index.html
    - assets/foliate-js/dist/
    - assets/foliate-js/src/
    - assets/foliate-js/src/vendor/
    - assets/foliate-js/src/vendor/pdfjs/
    - assets/foliate-js/src/vendor/prism/
    - assets/foliate-js/src/vendor/prism/components/
    - assets/foliate-js/src/vendor/prism/themes/
    - assets/images/
    - assets/images/book_share/
    - assets/images/bgimg/
    - assets/icon/
    - assets/CHANGELOG.md

  fonts:
    - family: SourceHanSerif
      fonts:
        - asset: assets/fonts/SourceHanSerifSC-Regular.otf
          weight: 400
        - asset: assets/fonts/SourceHanSerifSC-Bold.otf
          weight: 700
