# 打 tag 即构建未签名鸿蒙包（release / arm64），并在该 tag 上创建 GitHub Release。
#
# 构建本体在 build-hap.yaml（可复用 workflow）：tag 触发和手动重试共用同一份步骤，
# 本文件只管「什么时候跑」。工具链安装、版本换算、产物校验分别在那边和
# scripts/ci/build_ohos_ci.sh 里。
#
# 线上版本只取 tag 的 X.Y.Z（可带 -rc.1），不使用构建号；tag 里的 +N 会被忽略。
# 鸿蒙的 versionCode 不能为空，这里按 X.Y.Z 稳定换算，不是构建号。
# 构建只改 runner 工作区里的 pubspec.yaml / ohos/AppScope/app.json5，不回写仓库。
#
# 本机构建不受影响：本地仍走 scripts\build_ohos.ps1。
# 不想重推 tag 就要重跑：用 Retry HarmonyOS Build（retry-build.yaml）。
# 想换 Flutter 版本：配仓库 Variables 的 FLUTTER_OHOS_REF。
name: Build Unsigned HarmonyOS

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

concurrency:
  group: build-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-hap:
    uses: ./.github/workflows/build-hap.yaml
    with:
      tag: ${{ github.ref_name }}
      flutter_ref: ${{ vars.FLUTTER_OHOS_REF || 'oh-3.41.9-release' }}
    permissions:
      contents: write
