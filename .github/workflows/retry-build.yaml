# 手动重跑某个 tag 的未签名 HAP：不重推 tag、不改 tag 指向、不改版本号。
#
# 用途：runner 排队、网络抖动、工具链临时故障之后重试；或者只想重出一份包。
# 走的是和 tag 触发完全相同的 build-hap.yaml，所以产物命名、校验、Release 覆盖
# 行为都一致：同名文件会覆盖到该 tag 已有的 Release 上（没有 Release 就新建）。
# 构建工具（scripts/ci/build_ohos_ci.sh、scripts/ohos_patch_target_platform.py）取
# 本次 CI 所在 ref 的版本，源码仍用 tag 的；不改 tag、不重写 tag。
#
# 入口：Actions → Retry HarmonyOS Build → Run workflow → 填要重建的 tag。
name: Retry HarmonyOS Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 要重建的 tag（例如 v0.1.0）
        required: true
        type: string
      flutter_ref:
        description: 覆盖 flutter_flutter 分支/tag，留空用仓库变量 FLUTTER_OHOS_REF
        required: false
        type: string

permissions:
  contents: write

jobs:
  unsigned-hap:
    uses: ./.github/workflows/build-hap.yaml
    with:
      tag: ${{ inputs.tag }}
      flutter_ref: ${{ inputs.flutter_ref || vars.FLUTTER_OHOS_REF || 'oh-3.41.9-release' }}
    permissions:
      contents: write
